plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// The whole pack in a dev game: our mods built from source (see settings.gradle), every pack mod at the version in
// pack.json, and the pack's KubeJS scripts and config. ./gradlew runClient plays it, ./gradlew runServer serves it, and
// ./gradlew runGameTestServer runs every mod's game tests together with the full pack. The world and settings live in
// dev/run/ (git-ignored).

repositories {
    // MixinSquared, which Dungeon Delving bundles.
    exclusiveContent {
        forRepository {
            maven {
                name = "Bawnorton"
                url = "https://maven.bawnorton.com/releases"
            }
        }
        filter {
            includeGroup "com.github.bawnorton.mixinsquared"
        }
    }
    // CurseMaven: the pack's mods from CurseForge, as curse.maven:<slug>-<project>:<file>.
    exclusiveContent {
        forRepository {
            maven {
                name = "CurseMaven"
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            // Every one of our mods' tests, with the whole pack.
            systemProperty 'neoforge.enabledGameTestNamespaces', 'dungeondelving,ddprofessions,ddkingdom,deepmines'
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
}

configurations {

    runtimeClasspath.extendsFrom localRuntime
}

// Our mods, by folder next to this repository: the dependency each one's build provides.
